<button #trigger type="button" (click)="toggle()" [disabled]="disabled"
        [class]="triggerClass + ' flex items-center justify-between gap-2 text-left disabled:cursor-not-allowed disabled:opacity-50'">
  <span class="min-w-0 flex-1 truncate" [class.text-muted]="!selectedLabel">{{ selectedLabel || placeholder }}</span>
  <svg viewBox="0 0 20 20" fill="currentColor" [class]="'h-4 w-4 shrink-0 text-muted transition-transform ' + (open ? 'rotate-180' : '')">
    <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
  </svg>
</button>

@if (open) {
  <div class="app-select-panel fixed z-[1000] overflow-y-auto rounded-lg border border-line bg-white py-1 shadow-card"
       [style.top]="panelStyle.top" [style.left]="panelStyle.left" [style.width]="panelStyle.width" [style.max-height]="panelStyle.maxHeight">
    @for (opt of options; track opt.value) {
      <button type="button" (click)="select(opt)"
              class="flex w-full items-center justify-between gap-2 px-3.5 py-2.5 text-left text-[0.92rem] transition-colors hover:bg-[#eff6ff]"
              [class.bg-primary/5]="opt.value === value">
        <span class="truncate text-ink">{{ opt.label }}</span>
        @if (opt.value === value) {
          <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4 shrink-0 text-primary">
            <path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0l-3.5-3.5a1 1 0 111.4-1.4l2.8 2.8 6.8-6.8a1 1 0 011.4 0z" clip-rule="evenodd" />
          </svg>
        }
      </button>
    }
  </div>
}
