@if (variant() === 'filtered') {
  <div class="flex flex-col items-center justify-center gap-3 py-14 text-center">
    <div class="grid h-12 w-12 place-items-center rounded-xl bg-surface">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-slate-300">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <line x1="20" y1="20" x2="15.5" y2="15.5" />
      </svg>
    </div>
    <h3 class="m-0 text-[0.9rem] font-bold text-muted">{{ title() | translate }}</h3>
    @if (hint()) {
      <p class="m-0 max-w-xs text-[0.8rem] text-muted">{{ hint() | translate }}</p>
    }
  </div>
} @else {
  <div class="mx-auto my-6 flex w-full max-w-3xl flex-col items-center gap-6 p-10 text-center sm:flex-row sm:text-left">
    <div class="grid h-20 w-20 shrink-0 place-items-center rounded-2xl bg-primary-50 ring-1 ring-black/[0.03]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="h-9 w-9 text-primary-300">
        <rect x="3" y="7" width="18" height="13" rx="2" />
        <path d="M3 7l3-4h12l3 4" />
        <path d="M9 12h6" />
      </svg>
    </div>
    <div class="flex flex-1 flex-col items-center sm:items-start">
      <h3 class="m-0 text-[1.1rem] font-bold text-ink">{{ title() | translate }}</h3>
      @if (hint()) {
        <p class="m-0 mt-2 max-w-md text-[0.88rem] leading-relaxed text-muted">{{ hint() | translate }}</p>
      }
      <div class="mt-5 flex flex-wrap items-center gap-3">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
