<ol class="mb-8 flex items-center">
  @for (step of steps(); track step.label; let i = $index; let last = $last) {
    <li class="flex flex-1 items-center" [class.flex-none]="last">
      <div class="flex items-center gap-2.5">
        <span
          class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-[0.85rem] font-bold transition"
          [class]="i < current() ? 'bg-primary text-white' : i === current() ? 'bg-primary-50 text-primary ring-2 ring-primary' : 'bg-surface text-muted ring-1 ring-line'">
          @if (i < current()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M5 13l4 4L19 7" /></svg>
          } @else {
            {{ i + 1 }}
          }
        </span>
        <span class="hidden text-[0.85rem] font-bold sm:inline" [class]="i <= current() ? 'text-ink' : 'text-muted'">{{ step.label }}</span>
      </div>
      @if (!last) {
        <span class="mx-3 h-px flex-1" [class]="i < current() ? 'bg-primary' : 'bg-line'"></span>
      }
    </li>
  }
</ol>
