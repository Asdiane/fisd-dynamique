<div class="overflow-hidden rounded-2xl border border-line bg-white">
  <button type="button" (click)="toggle()" class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left">
    <span class="text-[1.1rem] font-bold text-ink">{{ title() }}</span>
    <span
      class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary text-white shadow-[0_8px_20px_rgba(0,0,255,0.18)] transition-transform duration-200"
      [class.rotate-45]="open()">
      <svg viewBox="0 0 20 20" fill="currentColor" class="h-[18px] w-[18px]">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
    </span>
  </button>
  <div class="grid transition-[grid-template-rows] duration-300 ease-out" [style.grid-template-rows]="open() ? '1fr' : '0fr'">
    <div class="overflow-hidden">
      <div class="px-6 pb-6 leading-[1.8] text-muted [&_h3]:mt-0 [&_h3]:text-[1.05rem] [&_h3]:text-ink [&_li]:leading-[1.8] [&_li]:text-muted [&_p]:leading-[1.8] [&_p]:text-muted [&_ul]:my-2 [&_ul]:list-disc [&_ul]:pl-6 [&_a]:font-bold [&_a]:text-primary">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
