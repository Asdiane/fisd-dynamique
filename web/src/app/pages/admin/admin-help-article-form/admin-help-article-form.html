<main class="mx-auto my-10 max-w-[900px] px-[22px] pb-[60px]">
  <a routerLink="/admin/help/manage" class="mb-4 inline-flex items-center gap-1.5 font-bold text-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M15 6l-6 6 6 6" /></svg>
    {{ 'AdminHelpArticles.YourArticles' | translate }}
  </a>

  <app-admin-page-header
    [eyebrow]="'AdminHelpArticles.Eyebrow' | translate"
    [title]="editingId ? ('AdminHelpArticles.EditTitle' | translate) : ('AdminHelpArticles.NewTitle' | translate)">
  </app-admin-page-header>

  <form (ngSubmit)="save()" class="mt-6 grid gap-6 rounded-[22px] border border-line bg-white p-8 sm:p-10">
    <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
      {{ 'AdminHelpArticles.FieldCategory' | translate }}
      <input name="category" maxlength="100" required [(ngModel)]="category" [placeholder]="'AdminHelpArticles.CategoryPlaceholder' | translate" class="w-full max-w-[320px] rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
    </label>

    <div class="flex gap-2 border-b border-line">
      <button type="button" (click)="activeLang.set('fr')" class="border-b-2 px-3 pb-2.5 text-[0.9rem] font-bold transition-colors"
        [class]="activeLang() === 'fr' ? 'border-primary text-primary' : 'border-transparent text-muted'">Français</button>
      <button type="button" (click)="activeLang.set('en')" class="border-b-2 px-3 pb-2.5 text-[0.9rem] font-bold transition-colors"
        [class]="activeLang() === 'en' ? 'border-primary text-primary' : 'border-transparent text-muted'">English</button>
    </div>

    @if (activeLang() === 'fr') {
      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminHelpArticles.FieldTitle' | translate }}
        <input name="titleFr" maxlength="300" required [(ngModel)]="titleFr" class="w-full rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
      </label>

      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminHelpArticles.FieldContent' | translate }}
        <textarea name="contentFr" rows="10" required [(ngModel)]="contentFr" class="w-full resize-y rounded-lg border border-slate-400 p-3.5 text-[0.98rem] leading-[1.6] text-ink"></textarea>
      </label>
    } @else {
      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminHelpArticles.FieldTitle' | translate }}
        <input name="titleEn" maxlength="300" required [(ngModel)]="titleEn" class="w-full rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
      </label>

      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminHelpArticles.FieldContent' | translate }}
        <textarea name="contentEn" rows="10" required [(ngModel)]="contentEn" class="w-full resize-y rounded-lg border border-slate-400 p-3.5 text-[0.98rem] leading-[1.6] text-ink"></textarea>
      </label>
    }

    <div class="flex flex-wrap items-end gap-6">
      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminContacts.FieldDisplayOrder' | translate }}
        <input name="displayOrder" type="number" min="1" [(ngModel)]="displayOrder" class="w-full max-w-[140px] rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
      </label>

      <label class="flex items-center gap-2.5 font-semibold text-slate-700">
        <input name="isVisible" type="checkbox" [(ngModel)]="isVisible" class="h-5 w-5" />
        {{ 'AdminContacts.FieldVisible' | translate }}
      </label>

      <label class="flex items-center gap-2.5 font-semibold text-slate-700">
        <input name="isPlatformAdminOnly" type="checkbox" [(ngModel)]="isPlatformAdminOnly" class="h-5 w-5" />
        {{ 'AdminHelpArticles.FieldPlatformAdminOnly' | translate }}
      </label>
    </div>

    <div class="mt-2 flex flex-wrap items-center gap-3">
      <button type="submit" [disabled]="busy()" class="rounded-lg bg-primary px-4 py-2.5 font-bold text-white disabled:cursor-wait disabled:opacity-50">{{ 'AdminContacts.Save' | translate }}</button>
      <a routerLink="/admin/help/manage" class="rounded-lg border border-primary px-4 py-2.5 font-bold text-primary">{{ 'AdminContacts.Cancel' | translate }}</a>
      @if (editingId) {
        <button type="button" [disabled]="busy()" (click)="delete()" class="ml-auto rounded-lg border border-[#b42318] px-4 py-2.5 font-bold text-[#b42318] disabled:cursor-wait disabled:opacity-50">{{ 'AdminParticipants.DeleteButton' | translate }}</button>
      }
    </div>
  </form>
</main>
