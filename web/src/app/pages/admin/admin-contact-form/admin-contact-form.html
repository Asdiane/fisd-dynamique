<main class="mx-auto my-10 max-w-[900px] px-[22px] pb-[60px]">
  <a routerLink="/admin/contacts" class="mb-4 inline-flex items-center gap-1.5 font-bold text-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M15 6l-6 6 6 6" /></svg>
    {{ 'AdminContacts.YourContacts' | translate }}
  </a>

  <app-admin-page-header
    [eyebrow]="'AdminContacts.Eyebrow' | translate"
    [title]="editingId ? ('AdminContacts.EditTitle' | translate) : ('AdminContacts.NewTitle' | translate)">
  </app-admin-page-header>

  <form (ngSubmit)="save()" class="mt-6 grid gap-6 rounded-[22px] border border-line bg-white p-8 sm:p-10">
    <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
      {{ 'AdminContacts.FieldType' | translate }}
      <app-select name="type" [(ngModel)]="type" [options]="typeOptions"></app-select>
    </label>

    <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
      {{ 'AdminContacts.FieldLabel' | translate }}
      <input name="label" maxlength="200" required [(ngModel)]="label" class="w-full rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
    </label>

    <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
      {{ 'AdminContacts.FieldValue' | translate }}
      <input name="value" maxlength="300" required [(ngModel)]="value" class="w-full rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
    </label>

    <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
      <span class="inline-flex items-center">
        {{ 'AdminContacts.FieldHref' | translate }}
        <app-admin-help-tip [text]="'AdminContacts.HelpHref' | translate"></app-admin-help-tip>
      </span>
      <input name="href" [(ngModel)]="href" [placeholder]="'AdminContacts.HrefPlaceholder' | translate" class="w-full rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
    </label>

    <div class="flex flex-wrap items-end gap-6">

      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'AdminContacts.FieldDisplayOrder' | translate }}
        <input name="displayOrder" type="number" min="1" [(ngModel)]="displayOrder" class="w-full max-w-[140px] rounded-lg border border-slate-400 p-3.5 text-[0.98rem] text-ink" />
      </label>

      <label class="grid gap-2 text-[0.95rem] font-semibold text-slate-700">
        {{ 'Common.FieldStatus' | translate }}
        <app-select name="status" [(ngModel)]="status" [options]="statusOptions" triggerClass="min-w-[160px] rounded-lg border border-slate-400 bg-white p-3.5 font-normal text-ink"></app-select>
      </label>

      <label class="flex items-center gap-2.5 font-semibold text-slate-700">
        <input name="isVisible" type="checkbox" [(ngModel)]="isVisible" class="h-5 w-5" />
        {{ 'AdminContacts.FieldVisible' | translate }}
      </label>

    </div>

    <div class="mt-2 flex flex-wrap items-center gap-3">
      <button type="submit" [disabled]="busy()" class="rounded-lg bg-primary px-4 py-2.5 font-bold text-white disabled:cursor-wait disabled:opacity-50">{{ 'AdminContacts.Save' | translate }}</button>
      <a routerLink="/admin/contacts" class="rounded-lg border border-primary px-4 py-2.5 font-bold text-primary">{{ 'AdminContacts.Cancel' | translate }}</a>
      @if (editingId) {
        <button type="button" [disabled]="busy()" (click)="delete()" class="ml-auto rounded-lg border border-[#b42318] px-4 py-2.5 font-bold text-[#b42318] disabled:cursor-wait disabled:opacity-50">{{ 'AdminParticipants.DeleteButton' | translate }}</button>
      }
    </div>
  </form>
</main>
