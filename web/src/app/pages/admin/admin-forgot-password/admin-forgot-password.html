<div class="grid min-h-screen place-items-center bg-surface px-6 py-10">
  <div class="w-full max-w-[380px]">
    <a routerLink="/admin" class="text-[0.85rem] font-semibold text-muted transition hover:text-primary">← {{ 'AdminForgotPassword.BackToLogin' | translate }}</a>

    <div class="mt-4">
      <h1 class="m-0 text-[1.5rem] font-bold text-primary-900">{{ 'AdminForgotPassword.Title' | translate }}</h1>
      <p class="mt-1.5 text-[0.92rem] text-muted">{{ 'AdminForgotPassword.Subtitle' | translate }}</p>
    </div>

    <div class="mt-6 rounded-2xl bg-white p-6 shadow-[0_25px_65px_-15px_rgba(0,0,34,0.18)] ring-1 ring-black/5 sm:p-7">
      @if (submitted()) {
        <div class="flex items-start gap-2 rounded-lg bg-[#eef2ff] px-3.5 py-3 text-[0.86rem] leading-relaxed text-ink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 h-4 w-4 shrink-0 text-primary"><path d="M20 6L9 17l-5-5" /></svg>
          <span>{{ 'AdminForgotPassword.SuccessMessage' | translate }}</span>
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()" class="grid gap-3.5">
          <label class="grid gap-1.5">
            <span class="text-[0.8rem] font-semibold text-slate-700">{{ 'AdminLogin.EmailLabel' | translate }}</span>
            <input
              name="email"
              type="email"
              autocomplete="username"
              required
              [(ngModel)]="email"
              class="h-11 w-full rounded-lg border-0 bg-surface px-3.5 text-[0.92rem] text-ink outline-none ring-1 ring-line transition placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-primary-300" />
          </label>

          <button
            type="submit"
            [disabled]="submitting()"
            class="mt-1.5 flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-primary text-[0.92rem] font-bold tracking-wide text-white transition hover:brightness-110 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50">
            @if (submitting()) {
              <span class="h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
            }
            {{ 'AdminForgotPassword.Submit' | translate }}
          </button>
        </form>
      }
    </div>
  </div>
</div>
