<main class="mx-auto my-10 max-w-[1200px] px-[22px] pb-[60px]">
  <app-admin-page-header
    [eyebrow]="'AdminMedia.Eyebrow' | translate"
    [title]="'AdminMedia.Title' | translate"
    [subtitle]="'AdminMedia.Subtitle' | translate">
  </app-admin-page-header>

  <app-admin-info-card
    [title]="'AdminMedia.InfoTitle' | translate"
    [description]="'AdminMedia.InfoBody' | translate">
  </app-admin-info-card>

  <section class="mt-6">
    <div class="mb-5 flex flex-wrap items-center gap-2.5">
      <button
        type="button"
        (click)="setFilter('all')"
        [class]="'rounded-full px-4 py-2 text-[0.88rem] font-bold ' + (categoryFilter() === 'all' ? 'bg-primary text-white' : 'border border-line bg-white text-ink')">
        {{ 'AdminMedia.AllCategories' | translate }}
      </button>
      @for (category of categories; track category) {
        <button
          type="button"
          (click)="setFilter(category)"
          [class]="'rounded-full px-4 py-2 text-[0.88rem] font-bold capitalize ' + (categoryFilter() === category ? 'bg-primary text-white' : 'border border-line bg-white text-ink')">
          {{ category }}
        </button>
      }
    </div>

    @if (!loading() && filteredFiles.length === 0) {
      <app-nodata [title]="'AdminMedia.EmptyState' | translate"></app-nodata>
    }

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @for (file of filteredFiles; track file.id) {
        <div class="overflow-hidden rounded-xl border border-line bg-white">
          <img [src]="file.url" [alt]="file.altText || file.originalFileName" class="aspect-square w-full bg-slate-50 object-contain" />
          <div class="grid min-w-0 gap-1 p-3">
            <small class="block truncate font-bold text-ink" [title]="file.originalFileName">{{ file.originalFileName }}</small>
            <small class="capitalize text-muted">{{ file.category }} · {{ formatSize(file.fileSizeBytes) }}</small>
            <button type="button" (click)="deleteFile(file)" class="mt-1 rounded-lg border border-[#b42318] px-3 py-1.5 text-[0.82rem] font-bold text-[#b42318]">
              {{ 'AdminMedia.DeleteButton' | translate }}
            </button>
          </div>
        </div>
      }
    </div>
  </section>
</main>
