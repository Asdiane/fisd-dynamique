<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FISD - Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #f7faff; color: #0f172a;
        }
        .card {
            text-align: center; max-width: 480px; padding: 48px 40px;
            background: #ffffff; border: 1px solid #dbe3ef; border-radius: 16px;
            box-shadow: 0 1px 3px 0 rgba(15,23,42,0.04), 0 1px 2px -1px rgba(15,23,42,0.06);
        }
        .logo {
            font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 32px;
            color: #0000FF;
        }
        .spinner-wrap { margin: 0 auto 28px; }
        .spinner {
            width: 36px; height: 36px; margin: 0 auto;
            border: 3px solid #dbe3ef; border-top-color: #0000FF;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; color: #0f172a; }
        p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 4px; font-weight: 400; }
        .lang-toggle {
            margin-top: 28px; display: flex; justify-content: center; gap: 6px;
        }
        .lang-toggle button {
            background: #f7faff; border: 1px solid #dbe3ef; color: #64748b;
            padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
            font-family: inherit; cursor: pointer; transition: all .15s ease;
        }
        .lang-toggle button:hover { border-color: #0000FF; color: #0000FF; }
        .lang-toggle button.active { background: #0000FF; border-color: #0000FF; color: #fff; }
        .lang { display: none; }
        .lang.active { display: block; }
        .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; font-weight: 400; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">FISD</div>
        <div class="spinner-wrap"><div class="spinner"></div></div>
        <div id="fr" class="lang active">
            <h1>Mise a jour en cours</h1>
            <p>Nous deployons une nouvelle version pour vous offrir une meilleure experience.</p>
            <p>Merci de patienter quelques instants.</p>
        </div>
        <div id="en" class="lang">
            <h1>Update in progress</h1>
            <p>We're deploying a new version to bring you a better experience.</p>
            <p>This will only take a moment.</p>
        </div>
        <div class="lang-toggle">
            <button id="btn-fr" class="active" onclick="switchLang('fr')">Francais</button>
            <button id="btn-en" onclick="switchLang('en')">English</button>
        </div>
    </div>
    <div class="footer">&copy; 2026 FISD</div>
    <script>
        function switchLang(lang) {
            document.querySelectorAll('.lang').forEach(function(el) { el.classList.remove('active'); });
            document.querySelectorAll('.lang-toggle button').forEach(function(el) { el.classList.remove('active'); });
            document.getElementById(lang).classList.add('active');
            document.getElementById('btn-' + lang).classList.add('active');
        }
        (function() {
            var userLang = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
            if (userLang.indexOf('fr') === -1) switchLang('en');
        })();
    </script>
</body>
</html>
